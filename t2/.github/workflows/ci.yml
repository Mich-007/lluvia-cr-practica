name: CI

# Construye y verifica en cada pull request y en cada push a main.
# Si falla, no se debe fusionar (activen "Require status checks" en la rama main).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build   # incluye scripts/verificar.mjs (cabeceras, scripts en línea, secretos)
